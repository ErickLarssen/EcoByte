# Atualizações de dependências (DEC-090, 09 §98): o Dependabot abre pull
# requests semanais, que passam pelo CI antes do merge. Alertas de segurança
# também geram PRs fora deste calendário.
version: 2
updates:
  # Workspaces npm (backend e frontend) a partir do package-lock.json da raiz.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Atualizações menores e de correção juntas, para não lotar a fila de PRs.
      minor-e-patch:
        update-types: [minor, patch]
    ignore:
      # Os tipos acompanham o Node.js do .nvmrc (22): tipos de uma versão mais
      # nova aceitariam APIs que o servidor não tem.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Versão maior do TypeScript só junto com o suporte do typescript-eslint
      # (hoje até 6.0) e por decisão registrada, não por PR automático.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Versões das actions usadas no CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
